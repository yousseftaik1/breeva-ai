<style>
  :root {
    --bone: #F4F1EA; --porcelain: #FAF7F1; --ink: #1B2233; --oxygen: #1A2B4A;
    --graphite: #4A5267; --hairline: #DDE3EC; --sky: #E6EEF7;
    --teal: #0FB5A8; --teal-glow: rgba(15,181,168,0.18);
    --serif: 'Newsreader','Tiempos',Georgia,serif;
    --sans: 'Geist','Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    --breath: cubic-bezier(0.37,0,0.18,1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased;
    background: radial-gradient(ellipse at 50% 30%, var(--sky) 0%, var(--bone) 65%);
    display:flex; flex-direction:column;
  }
  header { padding: 18px 48px; }
  .logo { display:flex; align-items:center; gap:8px; text-decoration:none; color:inherit; width:fit-content; }
  .logo img { width:38px; height:38px; object-fit:contain; margin-top:-2px; }
  .logo span { font-family:var(--serif); font-size:24px; font-weight:500; letter-spacing:-0.012em; line-height:1; }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding: 24px; }
  .card { max-width: 640px; text-align:center; }
  .dot {
    width:10px; height:10px; border-radius:50%; background:var(--teal); margin:0 auto 28px;
    box-shadow: 0 0 0 0 var(--teal-glow); animation: breathe 4.2s var(--breath) infinite;
  }
  @keyframes breathe {
    0%,100% { box-shadow: 0 0 0 0 var(--teal-glow); transform: scale(1); }
    50% { box-shadow: 0 0 0 14px rgba(15,181,168,0); transform: scale(1.15); }
  }
  h1 {
    font-family:var(--serif); font-weight:400; letter-spacing:-0.02em;
    font-size: clamp(32px, 5vw, 52px); line-height:1.12;
  }
  h1 em { color: var(--teal); font-style: italic; }
  .btn {
    display:inline-flex; align-items:center; margin-top:40px; padding:14px 24px; border-radius:999px;
    background:var(--ink); color:var(--bone); text-decoration:none; font-size:14px; font-weight:500;
    transition: transform 280ms var(--breath), background 280ms;
  }
  .btn:hover { background:var(--oxygen); transform:translateY(-1px); }
  @media (max-width:600px){ header{padding:16px 24px;} }
  @media (prefers-reduced-motion: reduce){ .dot{animation:none;} }
</style>
